services:
  - type: web
    name: moodle-discord-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python render_app.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: BOT_MODE
        value: "relay"
      - key: AI_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
